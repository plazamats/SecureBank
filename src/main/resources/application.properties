spring.application.name=securebank-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

securebank.jwt.secret=${JWT_SECRET}
securebank.jwt.access-token-minutes=${JWT_ACCESS_TTL_MINUTES:15}
securebank.jwt.refresh-token-days=${JWT_REFRESH_TTL_DAYS:7}
securebank.jwt.issuer=securebank-api

securebank.security.max-failed-attempts=5
securebank.security.lockout-minutes=15
securebank.security.require-email-verification=false
securebank.security.verification-token-hours=24
securebank.security.reset-token-minutes=30
securebank.security.bcrypt-strength=12

securebank.rate-limit.enabled=true
securebank.rate-limit.auth-requests-per-minute=20

securebank.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

securebank.accounts.max-per-user=5
securebank.mail.log-tokens=false

securebank.bootstrap.admin-email=${SECUREBANK_ADMIN_EMAIL:}
securebank.bootstrap.admin-password=${SECUREBANK_ADMIN_PASSWORD:}
