spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:securebank}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
logging.level.za.co.securebank=DEBUG
logging.level.org.springframework.security=INFO

securebank.mail.log-tokens=true
securebank.security.require-email-verification=false
